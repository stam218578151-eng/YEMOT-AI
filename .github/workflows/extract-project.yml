name: Extract supplied project archive
on:
  push:
    paths:
      - project-bootstrap.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || hashFiles('project-bootstrap.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract archive and normalize paths
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path("project-bootstrap.zip")
          if not archive.exists():
              print("Archive already extracted; nothing to do.")
              raise SystemExit(0)
          with ZipFile(archive) as z:
              for item in z.infolist():
                  rel = PurePosixPath(item.filename.replace("\\", "/"))
                  if rel.is_absolute() or ".." in rel.parts:
                      raise ValueError(f"Unsafe path: {item.filename}")
                  if item.is_dir():
                      continue
                  target = Path(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item.filename))
          archive.unlink()
          PY
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import supplied Yemot AI project files" || echo "No changes"
          git push
